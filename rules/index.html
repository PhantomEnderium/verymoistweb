<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Very Moist Playground - Server Rules</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <p id="output"></p>
  <p style="margin-top: 40px;">
    <a href="../">Return to Homepage</a>
  </p>

  <script>
    fetch("https://shadowloafs.xyz/api/tvmpDesc")
    .then(r => r.text())
    .then(text => {
    document.getElementById("output").innerHTML = convertUnityRichText(text);
    });

function renderUnityText(rawText) {
  return rawText
    .split("\n") // preserve Unity-style line structure
    .map(line => convertUnityRichText(line))
    .map(line => `<div class="unity-line">${line}</div>`)
    .join("");
}


// Core tag converter (Unity → HTML)
function convertUnityRichText(input) {
  return input

    // ALIGNMENT (block-like behavior inside line)
    .replace(/<align="?center"?>(.*?)<\/align>/g,
      '<div style="text-align:center">$1</div>')
    .replace(/<align="?left"?>(.*?)<\/align>/g,
      '<div style="text-align:left">$1</div>')
    .replace(/<align="?right"?>(.*?)<\/align>/g,
      '<div style="text-align:right">$1</div>')

    // BASIC FORMATTING
    .replace(/<b>(.*?)<\/b>/g, "<strong>$1</strong>")
    .replace(/<i>(.*?)<\/i>/g, "<em>$1</em>")
    .replace(/<u>(.*?)<\/u>/g, "<u>$1</u>")

    // SIZE
    .replace(/<size=(\d+)>(.*?)<\/size>/g,
      '<span style="font-size:$1px">$2</span>')

    // COLOR
    .replace(/<color=(.*?)>(.*?)<\/color>/g,
      '<span style="color:$1">$2</span>')

    // LINKS (Unity-style → HTML anchor)
    .replace(/<link="(.*?)">(.*?)<\/link>/g,
      '<a href="$1" target="_blank" rel="noopener noreferrer">$2</a>')

    // Remove raw newlines inside converted lines
    .replace(/\n/g, "");
}
  </script>
</body>
</html>
